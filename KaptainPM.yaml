apiVersion: kaptain.org/1.2
kind: kubernetes-run-platform-meta-environment
spec:
  global:
    projectName:
      stripRepositoryNamePrefix: test
  contents:
    # run-* children get stamped kaptain.org/apply-mode: seed-only by the RP
    # seed partition; the deploy reads one env var baked into the image and
    # pulls them out of the apply tree for special seed handling.
    - run-env-deployment-keel-all-in-one:[1.0,2.0)
    - run-env-job-keelson-all-in-one:[1.0,2.0)
  main:
    environment:
      deployMode: deployment
      imageAutoUpdateProvider: keelson
      generateIdealEnvironmentDeployManifests: true
      checksumSecretsTiming: build
      failOnUnreferencedConfigOrSecrets: true
      environmentDeployBaseImage:
        registry: ghcr.io
        namespace: kube-kaptain
        family: trixie-slim
        version: 1.0.13.1.34.1
      # Coverage: an RP with NO namespace oversight at all. Proves the
      # namespace keys are genuinely optional and that a run-platform build
      # works without them, which is the shape most RPs will actually have.
      cleanUp:
        policy: dryrun
        accumulatingResources:
          jobs:
            type: count
            count: 10
          configmaps:
            type: age
            age: 30d
          secrets:
            type: all
    hooks:
      preBuild: test-hooks/pre-build.bash
      preTaggingTests: test-hooks/pre-tagging-tests.bash
      postVersionsAndNaming: test-hooks/post-versions-and-naming.bash
      preDockerPrepare: test-hooks/pre-docker-prepare.bash
      postDockerTests: test-hooks/post-docker-tests.bash
      prePackagePrepare: test-hooks/pre-package-prepare.bash
      postPackageTests: test-hooks/post-package-tests.bash
      postBuild: test-hooks/post-build.bash
